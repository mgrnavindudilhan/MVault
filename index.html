<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mvault Sinhala | Movies & Series</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0c10; color: #eef2ff; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }
    .header { background: rgba(10,12,16,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100; padding: 1rem 0; }
    .nav-wrapper { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #e2b0ff, #9f7aea); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav-links a { color: #cfd9f2; text-decoration: none; font-weight: 600; margin: 0 1rem; cursor: pointer; }
    .nav-links a.active { color: #c084fc; }
    .admin-btn { background: rgba(192,132,252,0.2); padding: 6px 14px; border-radius: 40px; border: 1px solid #c084fc; cursor: pointer; }
    .hero { padding: 3rem 0 1rem; }
    .hero h2 { font-size: 2.5rem; background: linear-gradient(to right, #fff, #c0b7e8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; margin: 2rem 0; }
    .movie-card { background: #111317; border-radius: 1.5rem; overflow: hidden; cursor: pointer; transition: 0.25s; border: 1px solid rgba(255,255,255,0.05); }
    .movie-card:hover { transform: translateY(-6px); border-color: #c084fc; }
    .card-poster img { width: 100%; height: 320px; object-fit: cover; }
    .card-info { padding: 1rem; }
    .watch-btn { background: #c084fc; color: #0a0c10; padding: 6px 12px; border-radius: 30px; display: inline-block; margin-top: 10px; font-size: 0.8rem; }
    .video-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
    .modal-container { background: #0f1119; width: 90%; max-width: 1000px; border-radius: 1.5rem; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; padding: 1rem; background: #0b0d14; }
    .close-modal { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
    .video-wrapper iframe { width: 100%; height: 400px; border: none; }
    .admin-panel { display: none; background: #0e1018; padding: 2rem; border-radius: 2rem; margin: 2rem 0; }
    .admin-form input, .admin-form select { background: #1a1d2b; border: 1px solid #2e3440; padding: 10px; border-radius: 1rem; color: white; width: 100%; margin: 8px 0; }
    .btn { padding: 10px 20px; border-radius: 2rem; border: none; cursor: pointer; }
    .btn-primary { background: #c084fc; color: #0a0c10; }
    .delete-btn { background: #b91c1c; color: white; padding: 4px 12px; border-radius: 20px; border: none; cursor: pointer; margin-left: 10px; }
    .admin-item { background: #11131c; padding: 8px; margin: 5px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    footer { text-align: center; padding: 2rem; color: #5a617a; }
    @media (max-width:700px){ .container { padding: 0 1rem; } }
  </style>
</head>
<body>

<header class="header">
  <div class="container nav-wrapper">
    <div class="logo"><h1>Mvault Sinhala</h1></div>
    <div class="nav-links">
      <a class="nav-movies active" data-type="movies">🎬 චිත්‍රපට</a>
      <a class="nav-series" data-type="series">📺 ටීවී සීරීස්</a>
      <button id="openAdminBtn" class="admin-btn"><i class="fas fa-user-shield"></i> Admin</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="hero"><h2>GitHub Cloud වෙතින් සජීවී දත්ත</h2></div>
  <div id="contentArea" class="content-grid">📡 දත්ත පූරණය වේ...</div>
  
  <div id="adminPanel" class="admin-panel">
    <h3>🛠️ Admin Panel</h3>
    <div class="admin-form">
      <select id="itemType"><option value="movies">Movie</option><option value="series">Series</option></select>
      <input type="text" id="itemTitle" placeholder="Title *">
      <input type="text" id="itemYear" placeholder="Year">
      <input type="text" id="itemGenre" placeholder="Genre">
      <input type="text" id="itemPoster" placeholder="Poster Image URL">
      <input type="text" id="itemVideo" placeholder="Video URL (YouTube/Drive embed)">
      <button id="addBtn" class="btn btn-primary">➕ එකතු කරන්න</button>
    </div>
    <div id="adminList"></div>
    <button id="logoutAdmin" class="btn">🚪 Logout</button>
  </div>
</main>

<div id="videoModal" class="video-modal">
  <div class="modal-container">
    <div class="modal-header"><h3>🎬 Player</h3><button class="close-modal">&times;</button></div>
    <div class="video-wrapper"><iframe id="videoIframe" allowfullscreen></iframe></div>
  </div>
</div>

<footer>© 2025 Mvault | දත්ත GitHub Cloud මත සුරැකේ</footer>

<script>
  // ==================== ඔබගේ GitHub තොරතුරු ====================
  const GITHUB_USERNAME = "mgrnavindudilhan";
  const REPO_NAME = "MVault";
  
  const MOVIES_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/movies.json`;
  const SERIES_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/series.json`;
  
  // GitHub API URL (ලිවීමට)
  const MOVIES_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/movies.json`;
  const SERIES_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/series.json`;
  
  let GITHUB_TOKEN = "";  // Admin login වීමෙන් පසු ඇතුළත් කෙරේ
  
  // ==================== දත්ත ====================
  let moviesData = { movies: [] };
  let seriesData = { series: [] };
  let currentType = "movies";
  let isAdmin = false;
  
  const contentArea = document.getElementById("contentArea");
  const adminPanel = document.getElementById("adminPanel");
  const videoModal = document.getElementById("videoModal");
  const videoIframe = document.getElementById("videoIframe");
  
  // ==================== දත්ත කියවීම ====================
  async function fetchJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  
  async function loadAllData() {
    try {
      contentArea.innerHTML = "<div style='text-align:center'>📡 GitHub Cloud වෙතින් දත්ත ලබා ගැනේ...</div>";
      const [moviesRes, seriesRes] = await Promise.all([
        fetchJSON(MOVIES_RAW_URL).catch(() => ({ movies: [] })),
        fetchJSON(SERIES_RAW_URL).catch(() => ({ series: [] }))
      ]);
      moviesData = moviesRes;
      seriesData = seriesRes;
      renderContent();
      if (isAdmin) renderAdminList();
    } catch (err) {
      contentArea.innerHTML = `<div style="text-align:center; color:#f87171;">❌ දත්ත ලබා ගැනීම අසාර්ථකයි: ${err.message}</div>`;
    }
  }
  
  // ==================== ප්‍රදර්ශනය ====================
  function renderContent() {
    const items = currentType === "movies" ? (moviesData.movies || []) : (seriesData.series || []);
    if (!items.length) {
      contentArea.innerHTML = `<div style="text-align:center; padding:3rem;">📭 කිසිදු අයිතමයක් නොමැත.<br>Admin පැනලයෙන් එකතු කරන්න.</div>`;
      return;
    }
    let html = '';
    items.forEach(item => {
      html += `
        <div class="movie-card" data-video="${item.videoUrl || ''}">
          <div class="card-poster"><img src="${item.poster || 'https://placehold.co/400x500?text=No+Image'}" onerror="this.src='https://placehold.co/400x500'"></div>
          <div class="card-info"><h3>${escapeHtml(item.title)}</h3><p>${item.year || ''} | ${item.genre || ''}</p><div class="watch-btn">▶ Watch Now</div></div>
        </div>
      `;
    });
    contentArea.innerHTML = html;
    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', () => {
        const vlink = card.getAttribute('data-video');
        if (vlink) { videoIframe.src = vlink; videoModal.style.display = 'flex'; }
        else alert("⚠️ වීඩියෝ ලින්ක් එකක් නැත");
      });
    });
  }
  
  // ==================== GitHub වෙත ලිවීම (Token අවශ්‍යයි) ====================
  async function updateGitHubFile(apiUrl, content, isMovies) {
    if (!GITHUB_TOKEN) throw new Error("Token නැත");
    // get current file SHA
    let sha = "";
    try {
      const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${GITHUB_TOKEN}` } });
      if (getRes.ok) {
        const data = await getRes.json();
        sha = data.sha;
      }
    } catch(e) {}
    
    const body = {
      message: `Update ${isMovies ? "movies.json" : "series.json"} via Mvault Admin`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), // base64 encode
      sha: sha || undefined
    };
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: { Authorization: `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!putRes.ok) throw new Error(`HTTP ${putRes.status}`);
    return true;
  }
  
  async function addItem() {
    if (!isAdmin) { alert("Admin login වන්න"); return; }
    const type = document.getElementById("itemType").value;
    const newItem = {
      id: Date.now().toString(),
      title: document.getElementById("itemTitle").value.trim(),
      year: document.getElementById("itemYear").value.trim(),
      genre: document.getElementById("itemGenre").value.trim(),
      poster: document.getElementById("itemPoster").value.trim(),
      videoUrl: document.getElementById("itemVideo").value.trim()
    };
    if (!newItem.title) { alert("ශීර්ෂයක් ඇතුළත් කරන්න"); return; }
    
    try {
      if (type === "movies") {
        moviesData.movies.push(newItem);
        await updateGitHubFile(MOVIES_API_URL, moviesData, true);
      } else {
        seriesData.series.push(newItem);
        await updateGitHubFile(SERIES_API_URL, seriesData, false);
      }
      alert("✅ සාර්ථකව එකතු විය!");
      // clear form
      document.getElementById("itemTitle").value = "";
      document.getElementById("itemYear").value = "";
      document.getElementById("itemGenre").value = "";
      document.getElementById("itemPoster").value = "";
      document.getElementById("itemVideo").value = "";
      await loadAllData();
      if (isAdmin) renderAdminList();
    } catch (err) {
      alert("❌ දෝෂයක්: " + err.message);
    }
  }
  
  async function deleteItem(type, id) {
    if (!confirm("මෙය ස්ථිරවම මකා දමන්නද?")) return;
    try {
      if (type === "movies") {
        moviesData.movies = moviesData.movies.filter(m => m.id !== id);
        await updateGitHubFile(MOVIES_API_URL, moviesData, true);
      } else {
        seriesData.series = seriesData.series.filter(s => s.id !== id);
        await updateGitHubFile(SERIES_API_URL, seriesData, false);
      }
      alert("✅ මකා දමන ලදී");
      await loadAllData();
      if (isAdmin) renderAdminList();
    } catch (err) {
      alert("❌ දෝෂයක්: " + err.message);
    }
  }
  
  function renderAdminList() {
    let html = `<h4>🎬 Movies</h4>`;
    (moviesData.movies || []).forEach(m => {
      html += `<div class="admin-item"><span>${escapeHtml(m.title)} (${m.year || ''})</span><button class="delete-btn" data-type="movies" data-id="${m.id}">මකන්න</button></div>`;
    });
    html += `<h4>📺 Series</h4>`;
    (seriesData.series || []).forEach(s => {
      html += `<div class="admin-item"><span>${escapeHtml(s.title)} (${s.year || ''})</span><button class="delete-btn" data-type="series" data-id="${s.id}">මකන්න</button></div>`;
    });
    document.getElementById("adminList").innerHTML = html;
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.onclick = () => deleteItem(btn.dataset.type, btn.dataset.id);
    });
  }
  
  // ==================== Admin Login ====================
  function showAdminLogin() {
    const token = prompt("🔑 ඔබගේ GitHub Personal Access Token එක ඇතුළත් කරන්න:");
    if (token && token.length > 10) {
      GITHUB_TOKEN = token;
      isAdmin = true;
      adminPanel.style.display = "block";
      renderAdminList();
    } else alert("⚠️ වලංගු Token එකක් නැත");
  }
  
  document.getElementById("openAdminBtn").onclick = () => {
    if (isAdmin) {
      adminPanel.style.display = adminPanel.style.display === "block" ? "none" : "block";
      if (adminPanel.style.display === "block") renderAdminList();
    } else showAdminLogin();
  };
  document.getElementById("logoutAdmin").onclick = () => { isAdmin = false; GITHUB_TOKEN = ""; adminPanel.style.display = "none"; };
  document.getElementById("addBtn").onclick = addItem;
  
  // Navigation
  document.querySelector(".nav-movies").onclick = () => { currentType = "movies"; document.querySelector(".nav-movies").classList.add("active"); document.querySelector(".nav-series").classList.remove("active"); renderContent(); };
  document.querySelector(".nav-series").onclick = () => { currentType = "series"; document.querySelector(".nav-series").classList.add("active"); document.querySelector(".nav-movies").classList.remove("active"); renderContent(); };
  
  // Modal close
  document.querySelector(".close-modal").onclick = () => { videoModal.style.display = "none"; videoIframe.src = ""; };
  window.onclick = (e) => { if (e.target === videoModal) videoModal.style.display = "none"; };
  
  function escapeHtml(str) { return String(str || "").replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  
  // Start
  loadAllData();
</script>
</body>
</html>
