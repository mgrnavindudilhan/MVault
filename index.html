<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Mvault Sinhala | Boys Over Flowers Ep 01</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0c10;
      color: #eef2ff;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* header */
    .header {
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 0;
    }

    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e2b0ff, #9f7aea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo span {
      font-size: 0.8rem;
      color: #a1a5b0;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .nav-links a {
      color: #cfd9f2;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .nav-links a i {
      margin-right: 6px;
    }
    .nav-links a:hover, .nav-links a.active {
      color: #c084fc;
    }

    /* Hero & Cards */
    .hero {
      padding: 3rem 0 2rem;
    }
    .hero h2 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #c0b7e8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      color: #9ca3af;
      margin-top: 0.5rem;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
      margin: 2rem 0 3rem;
    }
    
    /* Movie Card - now clickable */
    .movie-card {
      background: #111317;
      border-radius: 1.5rem;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.3s;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
    }
    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.6);
      border-color: rgba(192, 132, 252, 0.5);
    }
    .card-poster {
      width: 100%;
      height: 320px;
      background: #1e1f2c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .movie-card:hover .card-poster img {
      transform: scale(1.03);
    }
    .card-info {
      padding: 1rem;
    }
    .card-info h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .card-info p {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 5px;
    }
    .year-badge {
      display: inline-block;
      background: #20222e;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-top: 8px;
    }
    .watch-btn {
      display: inline-block;
      margin-top: 12px;
      background: #c084fc;
      color: #0a0c10;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* Video Modal */
    .video-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(15px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-container {
      background: #0f1119;
      width: 90%;
      max-width: 1000px;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid #2a2e48;
      box-shadow: 0 25px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: #0b0d14;
      border-bottom: 1px solid #232638;
    }
    .modal-header h3 {
      font-size: 1.3rem;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    footer {
      text-align: center;
      padding: 2rem;
      color: #5a617a;
      border-top: 1px solid #1c1f2b;
      margin-top: 2rem;
    }
    @media (max-width: 700px) {
      .container { padding: 0 1.2rem; }
      .nav-wrapper { flex-direction: column; }
      .nav-links { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container nav-wrapper">
    <div class="logo">
      <h1>Mvault Sinhala</h1>
      <span>සුපිරි සිංහල විනෝදාස්වාදය</span>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-movies active" data-page="movies"><i class="fas fa-film"></i> චිත්‍රපට</a>
      <a href="#" class="nav-series" data-page="series"><i class="fas fa-tv"></i> ටීවී සීරීස්</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="hero">
    <h2>Boys Over Flowers සිංහල 📺</h2>
    <p>ප්‍රථම කථාංගය බලන්න - පින්තූරය මත ක්ලික් කරන්න</p>
  </div>

  <!-- Dynamic content area -->
  <div id="contentArea" class="content-grid"></div>
</main>

<!-- Video Modal Popup -->
<div id="videoModal" class="video-modal">
  <div class="modal-container">
    <div class="modal-header">
      <h3><i class="fas fa-play-circle"></i> Boys Over Flowers - කථාංගය 01</h3>
      <button class="close-modal" id="closeModalBtn">&times;</button>
    </div>
    <div class="video-wrapper">
      <!-- Google Drive embed video link (converted to /preview) -->
      <iframe id="videoIframe" src="https://drive.google.com/file/d/19l4FFjLCyrkJbPGNCgeQrklJ7GDGAugo/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 Mvault Sinhala — Premium entertainment experience.</p>
</footer>

<script>
  // Series Data: Only Boys Over Flowers Episode 1
  const seriesList = [
    {
      id: "bof_e01",
      title: "Boys Over Flowers - කථාංගය 01",
      year: "2025",
      genre: "Romantic Comedy, Drama",
      poster: "https://images.weserv.nl/?url=https://drive.google.com/uc?id=11N6zHRIAO_NoP8KJnJqKzo-tWgQPaFP_&output=jpg",
      videoUrl: "https://drive.google.com/file/d/19l4FFjLCyrkJbPGNCgeQrklJ7GDGAugo/preview"
    }
    {
      id:"titanic"
      title: "titanic"
      year: "1997"
      genre: "roman"
      poster: "https://images.weserv.nl/?url=https://drive.google.com/uc?id=10YRWRiW2gpqKAlUKFZa2R2f8fFp6UKfb&output=jpg"
      videourl: "https://drive.google.com/file/d/1ugwWdU3UIWNRm6m5luWHdqDeSxFV0AiF/view?usp=drivesdk"
    }
  ];

  // For movies we can keep empty or later add
  let movies = [];

  let currentView = "series";   // default series view
  const contentArea = document.getElementById("contentArea");
  const videoModal = document.getElementById("videoModal");
  const videoIframe = document.getElementById("videoIframe");
  const closeModalBtn = document.getElementById("closeModalBtn");

  // Render Series or Movies
  function renderContent() {
    if (currentView === "series") {
      if (!seriesList.length) {
        contentArea.innerHTML = `<div class="empty-msg">කිසිම සීරීස් එකක් නොමැත.</div>`;
        return;
      }
      let html = '';
      seriesList.forEach(series => {
        html += `
          <div class="movie-card" data-video="${series.videoUrl}">
            <div class="card-poster">
              <img src="${series.poster}" alt="${series.title} poster" onerror="this.src='https://placehold.co/400x500?text=No+Image'">
            </div>
            <div class="card-info">
              <h3>${escapeHtml(series.title)}</h3>
              <p>📅 ${series.year} &nbsp;| ${series.genre}</p>
              <div class="year-badge"><i class="fas fa-play"></i> ක්ලික් කර බලන්න</div>
              <div class="watch-btn">Watch Now</div>
            </div>
          </div>
        `;
      });
      contentArea.innerHTML = html;

      // attach click event to each card
      document.querySelectorAll('.movie-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const videoLink = card.getAttribute('data-video');
          if (videoLink) {
            videoIframe.src = videoLink;
            videoModal.style.display = 'flex';
          }
        });
      });
    } 
    else if (currentView === "movies") {
      // movies view (if any added later)
      if (movies.length === 0) {
        contentArea.innerHTML = `<div class="empty-msg"><i class="fas fa-film-slash"></i> මෙතෙක් චිත්‍රපට නොමැත. ඉක්මනින් එකතු වේ.</div>`;
      } else {
        // similar movie cards render
        let html = '';
        movies.forEach(m => {
          html += `<div class="movie-card"><div class="card-poster"><i class="fas fa-video fa-3x"></i></div><div class="card-info"><h3>${escapeHtml(m.title)}</h3><p>${m.year}</p></div></div>`;
        });
        contentArea.innerHTML = html;
      }
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Close modal function
  function closeModal() {
    videoModal.style.display = 'none';
    // stop video when closing
    videoIframe.src = "";
  }

  // Event listeners for navigation
  document.querySelector('.nav-movies').addEventListener('click', (e) => {
    e.preventDefault();
    currentView = "movies";
    document.querySelector('.nav-movies').classList.add('active');
    document.querySelector('.nav-series').classList.remove('active');
    renderContent();
  });

  document.querySelector('.nav-series').addEventListener('click', (e) => {
    e.preventDefault();
    currentView = "series";
    document.querySelector('.nav-series').classList.add('active');
    document.querySelector('.nav-movies').classList.remove('active');
    renderContent();
  });

  closeModalBtn.addEventListener('click', closeModal);
  window.addEventListener('click', (e) => {
    if (e.target === videoModal) closeModal();
  });

  // initial render
  renderContent();
</script>
</body>
</html>
